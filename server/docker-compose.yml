# Nakama + CockroachDB, rut gon tu file chinh thuc cua Heroic Labs:
# https://github.com/heroiclabs/nakama/blob/master/docker-compose.yml
#
# Da bo Prometheus — buoc nay chi can DUNG HAI API: dang nhap va luu du lieu
# nguoi choi. Ca hai Nakama deu co san, khong phai viet module server nao.
#
#   cd server
#   docker compose up -d
#   docker compose logs -f nakama      # cho toi khi thay "Startup done"
#
# Cong:
#   7350   API HTTP/gRPC cho client
#   7351   trang quan tri (mo http://127.0.0.1:7351, tai khoan admin:password)
#
#   docker compose down        # dung
#   docker compose down -v     # dung va XOA sach du lieu nguoi choi

services:
  cockroachdb:
    image: cockroachdb/cockroach:latest-v24.1
    command: start-single-node --insecure --store=attrs=ssd,path=/var/lib/cockroach/
    restart: "no"
    volumes:
      - data:/var/lib/cockroach
    expose:
      - "8080"
      - "26257"
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address root@cockroachdb:26257 &&
        exec /nakama/nakama
        --name nakama1
        --database.address root@cockroachdb:26257
        --logger.level INFO
        --session.token_expiry_sec 7200
    restart: "no"
    volumes:
      # Thu muc nay chinh la server/. Nakama nap module Lua tu
      # /nakama/data/modules, tuc server/modules/*.lua. Thieu dong nay thi no
      # bao "Found runtime modules count=0" va moi RPC deu "not found".
      - ./:/nakama/data
    depends_on:
      cockroachdb:
        condition: service_healthy
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
